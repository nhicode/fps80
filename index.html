<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tháng Tư Remix - Final Edition</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #000; color: #fff;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden; display: flex;
            justify-content: center; align-items: center;
        }

        #lyrics-container {
            text-align: center; width: 90%;
            perspective: 1000px;
        }

        #lyrics-text {
            font-size: 4.5rem; font-weight: 900;
            text-transform: uppercase; line-height: 1.2;
            transition: all 0.1s ease-out;
            /* Hiệu ứng Neon cực mạnh */
            text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px #00ffff, 0 0 80px #00ffff;
            opacity: 0; transform: scale(0.5);
        }

        #lyrics-text.active {
            opacity: 1; transform: scale(1);
        }

        #play-btn {
            position: fixed; padding: 25px 50px;
            font-size: 1.8rem; background: #00ffff;
            border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 0 30px #00ffff;
            font-weight: bold; z-index: 1000;
        }

        /* Hiệu ứng chớp màn hình theo nhịp Bass */
        .flash { animation: flash-hit 0.15s ease-out; }
        @keyframes flash-hit {
            0% { background: rgba(255,255,255,0.4); }
            100% { background: transparent; }
        }
    </style>
</head>
<body id="body">

    <button id="play-btn" onclick="startEngine()">CHẠY NHẠC & CHỮ</button>
    
    <div id="lyrics-container">
        <div id="lyrics-text"></div>
    </div>

    <audio id="music" src="DBE3051C-1E0A-4F57-8E64-3CE416FDD9C9.mp3"></audio>

    <script>
        const music = document.getElementById('music');
        const textDisplay = document.getElementById('lyrics-text');
        const body = document.getElementById('body');

        // LỜI BÀI HÁT KHỚP TỪNG GIÂY VỚI FILE CỦA BẠN
        const syncData = [
            { t: 0.1, txt: "Nhưng cánh hoa phai tàn..." },
            { t: 2.5, txt: "THẬT NHANH" },
            { t: 4.0, txt: "EM CÓ VỀ XA" },
            { t: 5.5, txt: "EM CÓ VỀ XA MÃI" },
            { t: 7.5, txt: "THÁNG TƯ ĐÔI KHI" },
            { t: 9.5, txt: "THẬT MONG MANH" },
            { t: 11.5, txt: "ĐỂ MÌNH NÓI RA" },
            { t: 13.5, txt: "CÂU CHÂN THẬT" },
            { t: 15.5, txt: "GIÁ NHƯ TÔI" },
            { t: 17.5, txt: "MỘT LẦN TIN EM" },
            { t: 19.5, txt: "CÔ GÁI CÓ NỤ CƯỜI" },
            { t: 21.0, txt: "TỎA NẮNG..." },
            { t: 23.0, txt: "ĐỂ LẠI THÁNG TƯ" },
            { t: 25.5, txt: "Ở ĐÓ!" }, // BẮT ĐẦU DROP
            { t: 27.0, txt: "THÁNG TƯ LÀ" },
            { t: 28.5, txt: "LỜI NÓI DỐI" },
            { t: 30.0, txt: "CỦA EM" },
            { t: 32.0, txt: "ANH CỨ BƯỚC ĐI" },
            { t: 34.0, txt: "VẬY ĐI!" },
            { t: 36.0, txt: "TẤT CẢ LÀ" },
            { t: 38.0, txt: "LỪA DỐI!!!" }
        ];

        function startEngine() {
            document.getElementById('play-btn').style.display = 'none';
            music.play();
            
            music.addEventListener('timeupdate', () => {
                const now = music.currentTime;
                const activeLine = syncData.filter(x => x.t <= now).pop();

                if (activeLine && textDisplay.innerText !== activeLine.txt) {
                    textDisplay.classList.remove('active');
                    
                    // Delay cực ngắn để tạo hiệu ứng pop-up
                    setTimeout(() => {
                        textDisplay.innerText = activeLine.txt;
                        textDisplay.classList.add('active');
                        
                        // Hiệu ứng giật màn hình khi vào nhịp Drop (từ giây 25)
                        if (now >= 25) {
                            body.classList.add('flash');
                            setTimeout(() => body.classList.remove('flash'), 150);
                        }
                    }, 50);
                }
            });
        }
    </script>
</body>
</html>
