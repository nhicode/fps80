<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tháng Tư Remix - Minimalist Black</title>
    <style>
        /* THIẾT LẬP MÀN HÌNH ĐEN TUYỆT ĐỐI */
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #000; /* Màn hình đen */
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTAINER LỜI BÀI HÁT */
        #lyrics-container {
            position: absolute;
            bottom: 20%; /* Vị trí thấp bên dưới như yêu cầu trước đó */
            width: 100%;
            text-align: center;
        }

        #lyrics-text {
            color: #fff;
            font-size: 3.8rem; /* Tăng nhẹ kích thước cho rõ trên nền đen */
            font-weight: 900;
            text-transform: uppercase;
            /* Hiệu ứng chữ sáng rực rỡ (Cyan Glow) */
            text-shadow: 0 0 15px #fff, 0 0 30px #00ffff, 0 0 45px #00ffff;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.2s ease-out;
        }

        #lyrics-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* NÚT BẤM KHỞI ĐỘNG */
        #play-btn {
            position: fixed; 
            padding: 20px 50px; 
            font-size: 1.5rem;
            background: none; 
            border: 2px solid #00ffff; 
            color: #00ffff;
            border-radius: 50px;
            cursor: pointer; 
            font-weight: bold; 
            z-index: 1000;
            text-shadow: 0 0 10px #00ffff;
            box-shadow: 0 0 20px #00ffff;
            transition: 0.3s;
        }

        #play-btn:hover {
            background: #00ffff;
            color: #000;
        }
    </style>
</head>
<body>

    <button id="play-btn" onclick="startAll()">BẮT ĐẦU</button>

    <div id="lyrics-container">
        <div id="lyrics-text"></div>
    </div>

    <audio id="music" src="9919142E-5301-4E5F-A7E7-03B34A407F2D.mp3"></audio>

    <script>
        const music = document.getElementById('music');
        const textDisplay = document.getElementById('lyrics-text');
        const btn = document.getElementById('play-btn');

        // DỮ LIỆU ĐỒNG BỘ LỜI
        const syncData = [
            { t: 0, txt: "..." },
            { t: 0.1, txt: "Những cánh hoa phai tàn" },
            { t: 2.0, txt: "THẬT NHANH!" },
            { t: 3.5, txt: "EM CÓ VỀ XA..." },
            { t: 5.3, txt: "EM CÓ VỀ XA MÃI?" },
            { t: 7.0, txt: "Tháng tư đôi khi" },
            { t: 9.0, txt: "THẬT MONG MANH" },
            { t: 10.7, txt: "Để mình nói ra" },
            { t: 12.5, txt: "CÂU CHÂN THẬT" },
            { t: 14.5, txt: "Giá như tôi một lần" },
            { t: 16.0, txt: "TIN EM..." },
            { t: 17.7, txt: "Cô tôi thương" },
            { t: 19.7, txt: "nay hoà vào mây gió" },
            { t: 22.5, txt: "Để lại tháng tư..." },
            { t: 24.0, txt: "Ở ĐÓ!" }
        ];

        function startAll() {
            btn.style.display = 'none';
            music.play();
            
            function update() {
                const now = music.currentTime;
                // Lấy câu thoại khớp với thời gian hiện tại
                const current = syncData.filter(l => l.t <= now).pop();

                if (current && textDisplay.innerText !== current.txt) {
                    textDisplay.classList.remove('active');
                    // Delay nhỏ để tạo hiệu ứng mượt khi đổi chữ
                    setTimeout(() => {
                        textDisplay.innerText = current.txt;
                        textDisplay.classList.add('active');
                    }, 50);
                }
                requestAnimationFrame(update);
            }
            update();
        }
    </script>
</body>
</html>
