<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tháng Tư Remix - Auto Play</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            background: #000;
        }

        #video-bg {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            z-index: -1; 
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        #lyrics-container {
            position: absolute;
            bottom: 15%; 
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        #lyrics-text {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 10px #fff, 0 0 20px #00ffff, 0 0 40px #00ffff;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #lyrics-text.active { opacity: 1; }
    </style>
</head>
<body onload="autoStart()">

    <video id="video-bg" muted playsinline>
        <source src="https://raw.githubusercontent.com/nhicode/fps80/main/IMG_1596.MOV" type="video/quicktime">
        <source src="https://raw.githubusercontent.com/nhicode/fps80/main/IMG_1596.MOV" type="video/mp4">
    </video>

    <div id="lyrics-container">
        <div id="lyrics-text"></div>
    </div>

    <audio id="music" src="9919142E-5301-4E5F-A7E7-03B34A407F2D.mp3"></audio>

    <script>
        const video = document.getElementById('video-bg');
        const music = document.getElementById('music');
        const textDisplay = document.getElementById('lyrics-text');

        const syncData = [
            { t: 0.1, txt: "Những cánh hoa phai tàn" },
            { t: 2.1, txt: "THẬT NHANH!" },
            { t: 3.7, txt: "EM CÓ VỀ XA..." },
            { t: 5.5, txt: "EM CÓ VỀ XA MÃI?" },
            { t: 7.3, txt: "Tháng tư đôi khi" },
            { t: 9.1, txt: "THẬT MONG MANH" },
            { t: 11.0, txt: "Để mình nói ra" },
            { t: 12.8, txt: "CÂU CHÂN THẬT" },
            { t: 14.8, txt: "Giá như tôi một lần" },
            { t: 16.8, txt: "TIN EM..." },
            { t: 18.5, txt: "Cô tôi thương" },
            { t: 20.5, txt: "nay hoà vào mây gió" },
            { t: 22.5, txt: "Để lại tháng tư..." },
            { t: 24.5, txt: "Ở ĐÓ!" }
        ];

        function autoStart() {
            // Cố gắng chạy nhạc và video ngay khi load trang
            const playPromise = music.play();

            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    // Nhạc chạy được -> Cho video chạy luôn
                    video.play();
                    startLyrics();
                }).catch(error => {
                    // Nếu trình duyệt vẫn chặn, cần click 1 cái bất kỳ vào màn hình để kích hoạt
                    console.log("Trình duyệt chặn tự động. Click bất kỳ để chạy!");
                    document.addEventListener('click', () => {
                        music.play();
                        video.play();
                        startLyrics();
                    }, { once: true });
                });
            }
        }

        function startLyrics() {
            function update() {
                const now = music.currentTime;
                const current = syncData.filter(l => l.t <= now).pop();

                if (current && textDisplay.innerText !== current.txt) {
                    textDisplay.classList.remove('active');
                    setTimeout(() => {
                        textDisplay.innerText = current.txt;
                        textDisplay.classList.add('active');
                    }, 30);
                }
                
                if (!music.paused) {
                    requestAnimationFrame(update);
                }
            }
            update();
        }

        video.onended = () => { video.pause(); };
    </script>
</body>
</html>
