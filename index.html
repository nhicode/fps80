<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tháng Tư Remix - Touch to Play</title>
    <style>
        /* NỀN ĐEN KHI CHƯA CHẠY */
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            background: #000;
            cursor: pointer; /* Hiển thị biểu tượng bàn tay để biết là cần click */
        }

        #video-bg {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            z-index: -1; 
            transform: translate(-50%, -50%);
            object-fit: cover;
            display: block;
            opacity: 0; /* Ẩn video khi chưa chạm */
            transition: opacity 0.5s ease;
        }

        #lyrics-container {
            position: absolute;
            bottom: 15%; 
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        #lyrics-text {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 15px #fff, 0 0 30px #00ffff, 0 0 45px #00ffff;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #lyrics-text.active { opacity: 1; }

        /* THÔNG BÁO HƯỚNG DẪN NHẸ */
        #hint {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 100;
        }
    </style>
</head>
<body onclick="startAll()">

    <div id="hint">CHẠM VÀO MÀN HÌNH ĐỂ CHẠY</div>

    <video id="video-bg" muted playsinline>
        <source src="https://raw.githubusercontent.com/nhicode/fps80/main/IMG_1596.MOV" type="video/quicktime">
        <source src="https://raw.githubusercontent.com/nhicode/fps80/main/IMG_1596.MOV" type="video/mp4">
    </video>

    <div id="lyrics-container">
        <div id="lyrics-text"></div>
    </div>

    <audio id="music" src="9919142E-5301-4E5F-A7E7-03B34A407F2D.mp3"></audio>

    <script>
        const video = document.getElementById('video-bg');
        const music = document.getElementById('music');
        const textDisplay = document.getElementById('lyrics-text');
        const hint = document.getElementById('hint');

        const syncData = [
            { t: 0.1, txt: "Những cánh hoa phai tàn" },
            { t: 2.1, txt: "THẬT NHANH!" },
            { t: 3.7, txt: "EM CÓ VỀ XA..." },
            { t: 5.5, txt: "EM CÓ VỀ XA MÃI?" },
            { t: 7.3, txt: "Tháng tư đôi khi" },
            { t: 9.1, txt: "THẬT MONG MANH" },
            { t: 11.0, txt: "Để mình nói ra" },
            { t: 12.8, txt: "CÂU CHÂN THẬT" },
            { t: 14.8, txt: "Giá như tôi một lần" },
            { t: 16.8, txt: "TIN EM..." },
            { t: 18.5, txt: "Cô tôi thương" },
            { t: 20.5, txt: "nay hoà vào mây gió" },
            { t: 22.5, txt: "Để lại tháng tư..." },
            { t: 24.5, txt: "Ở ĐÓ!" }
        ];

        let started = false;

        function startAll() {
            if (started) return; // Chỉ chạy 1 lần duy nhất khi chạm
            started = true;

            // Ẩn dòng chữ hướng dẫn
            hint.style.display = 'none';

            // Hiện video và chạy
            video.style.opacity = '1';
            video.play();
            music.play();
            
            function update() {
                const now = music.currentTime;
                const current = syncData.filter(l => l.t <= now).pop();

                if (current && textDisplay.innerText !== current.txt) {
                    textDisplay.classList.remove('active');
                    setTimeout(() => {
                        textDisplay.innerText = current.txt;
                        textDisplay.classList.add('active');
                    }, 30);
                }
                if (!music.paused) requestAnimationFrame(update);
            }
            update();
        }

        // Dừng video ở khung cuối
        video.onended = () => { video.pause(); };
    </script>
</body>
</html>
