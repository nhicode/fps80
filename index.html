<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tháng Tư Remix - Video Background</title>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: #000; overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        /* VIDEO NỀN */
        #video-bg {
            position: fixed;
            right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -1;
            filter: brightness(0.6); /* Làm tối video một chút để nổi chữ */
            object-fit: cover;
        }

        /* CONTAINER LỜI BÀI HÁT */
        #lyrics-container {
            position: absolute;
            bottom: 15%; /* Đưa chữ xuống phía dưới 1 chút như bạn yêu cầu */
            width: 100%;
            text-align: center;
        }

        #lyrics-text {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            /* Hiệu ứng chữ sáng rực rỡ */
            text-shadow: 0 0 10px #fff, 0 0 20px #00ffff, 0 0 40px #00ffff;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.2s ease-out;
        }

        #lyrics-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        #play-btn {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 50px; font-size: 1.5rem;
            background: rgba(0, 255, 255, 0.8);
            border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; z-index: 1000;
            box-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body>

    <button id="play-btn" onclick="startAll()">BẮT ĐẦU VIDEO & NHẠC</button>

    <video id="video-bg" loop muted playsinline>
        <source src="IMG_1596.MOV" type="video/mp4">
    </video>

    <div id="lyrics-container">
        <div id="lyrics-text"></div>
    </div>

    <audio id="music" src="9919142E-5301-4E5F-A7E7-03B34A407F2D.mp3"></audio>

    <script>
        const video = document.getElementById('video-bg');
        const music = document.getElementById('music');
        const textDisplay = document.getElementById('lyrics-text');
        const btn = document.getElementById('play-btn');

        // ĐỒNG BỘ LỜI THEO FILE NHẠC MỚI (9919142E...)
        const syncData = [
            { t: 1, txt: "Những cánh hoa phai tàn" },
            { t: 2.0, txt: "THẬT NHANH!" },
            { t: 3.5, txt: "EM CÓ VỀ XA..." },
            { t: 5.3, txt: "EM CÓ VỀ XA MÃI?" },
            { t: 7.0, txt: "Tháng tư đôi khi" },
            { t: 9.0, txt: "THẬT MONG MANH" },
            { t: 10.7, txt: "Để mình nói ra" },
            { t: 12.5, txt: "CÂU CHÂN THẬT" },
            { t: 14.5, txt: "Giá như tôi một lần" },
            { t: 16.0, txt: "TIN EM..." },
            { t: 18.0, txt: "Cô gái có nụ cười" },
            { t: 20.0, txt: "hoà vào mây gió" },
            { t: 22.0, txt: "Để lại tháng tư..." },
            { t: 24.0, txt: "Ở ĐÓ!" }
        ];

        function startAll() {
            btn.style.display = 'none';
            video.play();
            music.play();
            
            // Dùng requestAnimationFrame để chữ nhảy cực nhạy theo nhịp
            function update() {
                const now = music.currentTime;
                const current = syncData.filter(l => l.t <= now).pop();

                if (current && textDisplay.innerText !== current.txt) {
                    textDisplay.classList.remove('active');
                    setTimeout(() => {
                        textDisplay.innerText = current.txt;
                        textDisplay.classList.add('active');
                    }, 50);
                }
                requestAnimationFrame(update);
            }
            update();
        }

        // Đồng bộ lại nếu nhạc bị đứng
        music.onpause = () => video.pause();
        music.onplay = () => video.play();
    </script>
</body>
</html>
