<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tháng Tư Remix - Transparent Fix</title>
    <style>
        /* XÓA BỎ NỀN ĐEN - ĐỂ TRỐNG ĐỂ VIDEO HIỆN LÊN */
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            background: none !important; /* Buộc không có nền */
        }

        /* VIDEO NỀN - ĐƯA RA LỚP SAU CÙNG */
        #video-bg {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -1; 
            transform: translate(-50%, -50%);
            object-fit: cover;
            display: block;
        }

        /* LỚP PHỦ LÀM TỐI NHẸ (CHỈ KHI VIDEO ĐÃ CHẠY) */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); /* Chỉ tối 30% để nổi chữ, không đen kịt */
            z-index: 0;
            pointer-events: none;
        }

        #lyrics-container {
            position: absolute;
            bottom: 12%; /* Hạ thấp chữ xuống dưới */
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        #lyrics-text {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 10px #fff, 0 0 20px #00ffff, 0 0 40px #00ffff;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #lyrics-text.active { opacity: 1; }

        #play-btn {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 50px; font-size: 1.5rem;
            background: #00ffff; border: none; border-radius: 50px;
            cursor: pointer; font-weight: bold; z-index: 1000;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <button id="play-btn" onclick="startAll()">BẤM ĐỂ HIỆN VIDEO</button>
    <div class="overlay"></div>

    <video id="video-bg" loop muted playsinline autoplay>
        <source src="https://raw.githubusercontent.com/nhicode/fps80/main/IMG_1596.MOV" type="video/quicktime">
        <source src="https://raw.githubusercontent.com/nhicode/fps80/main/IMG_1596.MOV" type="video/mp4">
    </video>

    <div id="lyrics-container">
        <div id="lyrics-text"></div>
    </div>

    <audio id="music" src="9919142E-5301-4E5F-A7E7-03B34A407F2D.mp3"></audio>

    <script>
        const video = document.getElementById('video-bg');
        const music = document.getElementById('music');
        const textDisplay = document.getElementById('lyrics-text');
        const btn = document.getElementById('play-btn');

        const syncData = [
            { t: 0.1, txt: "Những cánh hoa phai tàn" },
            { t: 2.1, txt: "THẬT NHANH!" },
            { t: 3.7, txt: "EM CÓ VỀ XA..." },
            { t: 5.5, txt: "EM CÓ VỀ XA MÃI?" },
            { t: 7.3, txt: "Tháng tư đôi khi" },
            { t: 9.1, txt: "THẬT MONG MANH" },
            { t: 11.0, txt: "Để mình nói ra" },
            { t: 12.8, txt: "CÂU CHÂN THẬT" },
            { t: 14.8, txt: "Giá như tôi một lần" },
            { t: 16.8, txt: "TIN EM..." },
            { t: 18.5, txt: "Cô tôi thương" },
            { t: 20.5, txt: "nay hoà vào mây gió" },
            { t: 22.5, txt: "Để lại tháng tư..." },
            { t: 24.5, txt: "Ở ĐÓ!" }
        ];

        function startAll() {
            btn.style.display = 'none';
            video.play();
            music.play();
            
            function update() {
                const now = music.currentTime;
                const current = syncData.filter(l => l.t <= now).pop();

                if (current && textDisplay.innerText !== current.txt) {
                    textDisplay.classList.remove('active');
                    setTimeout(() => {
                        textDisplay.innerText = current.txt;
                        textDisplay.classList.add('active');
                    }, 30);
                }
                requestAnimationFrame(update);
            }
            update();
        }
    </script>
</body>
</html>
